name = "mindsoulbody-api"
main = "friends.mjs"
compatibility_date = "2024-11-01"
account_id = "9dfa3f6855e752c53df1b9b8632cf51e"
workers_dev = true
preview_urls = false

# Existing production namespace. Do not create a new one.
[[kv_namespaces]]
binding = "FRIENDS"
id = "2429d982103e4d7cabcbda5ad113fc94"

[triggers]
crons = ["*/15 * * * *"]

# Public key only. Generate a pair with: node worker/gen-vapid.mjs
# Replace this empty string with VAPID_PUBLIC_KEY before deploy.
# Set VAPID_PRIVATE_KEY and VAPID_SUBJECT with `wrangler secret put`. Never commit them.
[vars]
VAPID_PUBLIC_KEY = ""
